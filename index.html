<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>城建设计局 · 成长奖励 v3.14.0</title>
  <meta name="theme-color" content="#0b1220">
  <link rel="icon" href="favicon.ico?v=3" sizes="any">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/icons/favicon-32.png?v=3">
  <link rel="icon" type="image/png" sizes="192x192" href="assets/icons/icon-192.png?v=3">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/icons/apple-touch-icon.png?v=3">
  <link rel="stylesheet" href="style.css?v=3140b">
</head>
<body>
  <header class="hud">
    <div class="hud-brand">
      <img class="logo" src="assets/icons/icon-192.png?v=3" width="40" height="40" alt="">
      <div>
        <h1>城建设计局</h1>
        <p id="gameSubtitle">30 回合 · 达成建设目标才通关</p>
      </div>
    </div>
    <div class="hud-stats">
      <div class="stat"><span class="k">回合</span><span class="v" id="statTurn">1 / 30</span></div>
      <div class="stat"><span class="k">金钱</span><span class="v money" id="statMoney">300</span></div>
      <div class="stat"><span class="k">人口</span><span class="v" id="statPop">5</span></div>
      <div class="stat"><span class="k">满意度</span><span class="v sat" id="statSat">0.0</span></div>
      <div class="stat"><span class="k">声望</span><span class="v rep" id="statRep">0</span><small class="stat-sub" id="statRepNext">下回合声望 +0</small></div>
      <div class="stat"><span class="k">劳力 已占/人口</span><span class="v labor" id="statLabor">0 / 5</span></div>
      <div class="stat"><span class="k">城市</span><span class="v" id="statCity">0 / 24</span></div>
      <div class="stat"><span class="k">城镇</span><span class="v town" id="statTown">Lv.0</span><small class="stat-sub" id="statTownNext">下阶 P6</small></div>
      <div class="stat"><span class="k">最佳声望</span><span class="v best" id="statBest">—</span></div>
    </div>
  </header>

  <main class="layout">
    <section class="panel goal-panel" id="goalPanel" aria-label="本关建设目标">
      <div class="goal-heading"><h2>建设目标</h2><span class="goal-state">请选择关卡</span></div>
      <p class="goal-note">选择关卡后查看本局建设要求。</p>
    </section>
    <div class="col col-left">
      <section class="panel res-panel">
        <div class="panel-head">
          <h2>资源</h2>
          <span class="hint">当前 → 下回合预测 · 建造后更新</span>
        </div>
        <div id="resGrid" class="res-grid"></div>
        <div id="satMath" class="sat-math"></div>
      </section>

      <section class="panel city-panel">
        <div class="panel-head">
          <h2>城市</h2>
          <span class="hint" id="cityHint">0 / 24</span>
        </div>
        <div id="cityList" class="city-list"></div>
      </section>
    </div>

    <section class="panel task-panel">
      <div class="panel-head">
        <h2>任务</h2>
        <span class="hint" id="taskHint">任务栏 4 · 进行中 0</span>
      </div>
      <div id="taskFilter" class="filter-bar">
        <button data-filter="all" class="filter-btn on" type="button">全部</button>
        <button data-filter="normal" class="filter-btn" type="button">普通</button>
        <button data-filter="timed" class="filter-btn" type="button">限时</button>
        <button data-filter="malignant" class="filter-btn" type="button">恶性</button>
      </div>
      <div id="boardList" class="board-list"></div>
      <div class="sub-head">进行中 <span id="activeCount">0</span></div>
      <div id="activeList" class="active-list"></div>
    </section>

    <div class="col col-right">
      <section class="panel build-panel">
        <div class="panel-head">
          <h2>建造</h2>
          <span class="hint" id="buildHint">每回合 1 次</span>
        </div>
        <div id="townUpgrade" class="town-upgrade"></div>
        <div id="buildList" class="build-list"></div>
      </section>

      <section class="panel log-panel">
        <div class="panel-head">
          <h2>日志</h2>
          <span class="hint">最近 40 条</span>
        </div>
        <div id="logList" class="log-list"></div>
      </section>
    </div>
  </main>

  <footer class="action-bar">
    <button id="btnNext" class="btn primary" type="button">进入下回合 →</button>
    <button id="btnRestart" class="btn ghost" type="button">选关</button>
    <button id="btnGrowth" class="btn ghost" type="button">成长</button>
    <button id="btnHelp" class="btn ghost" type="button">规则</button>
    <span class="save-note" id="saveNote">自动存档</span>
    <div class="action-hint" id="actionHint"></div>
  </footer>

  <div id="modal" class="modal hidden">
    <div id="modalCard" class="modal-card"></div>
  </div>
  <button id="btnShowModal" class="btn primary show-modal hidden" type="button">返回选择 · 资源/人口</button>
  <div id="toast" class="toast"></div>

  <script src="game.js?v=3140b"></script>
  <script src="progress.js?v=3140b"></script>
  <script src="ui.js?v=3140b"></script>
</body>
</html>
